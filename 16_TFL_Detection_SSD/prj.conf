# Включает кастомный сервис трансляции видео по WebSocket, определенный в Kconfig-файле проекта.
CONFIG_NET_VIDEO_WEBSOCKET_SERVICE=y

# Позволяет Zephyr в рантайме мониторить реальное использование стека и точно определять, если какому-то потоку начинает не хватать памяти.
CONFIG_INIT_STACKS=y
# Устанавливает размер стека главного потока main() в 4 КБ.
CONFIG_MAIN_STACK_SIZE=4096
# Размер стека системной рабочей очереди для отложенного выполнения задач.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Включает интерактивную командную строку, позволяет подключаться к устройству через UART или USB-консоль и вводить команды для отладки.
CONFIG_SHELL=y
# Активирует глобальную систему логирования, которая позволяет выводить отладочные сообщения в консоль.
CONFIG_LOG=y

# Включают генераторы случайных чисел. 
# Необходимы криптографическим подсистемам и сетевому стеку для генерации случайных идентификаторов сессий и портов.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Включает встроенную в Zephyr библиотеку для работы с JSON.
CONFIG_JSON_LIBRARY=y

# Позволяет устройству выступать в роли HTTP-клиента
CONFIG_HTTP_CLIENT=y
# Активирует встроенный легковесный HTTP-сервер Zephyr для отдачи веб-страниц.
CONFIG_HTTP_SERVER=y
# Добавляет поддержку протокола WebSocket для HTTP-сервера.
CONFIG_HTTP_SERVER_WEBSOCKET=y

# Включает официальный HTTP-парсер (на базе node.js http-parser) и отдельную опцию разбора URL.
# Позволяет серверу корректно парсить входящие HTTP-запросы, заголовки и пути.
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_PARSER=y

# Networking config
# Главный переключатель сетевого стека Zephyr.
CONFIG_NETWORKING=y
# Включает поддержку протокола IPv4.
CONFIG_NET_IPV4=y
# Отключает IPv6 для экономии оперативной и флеш-памяти микроконтроллера.
CONFIG_NET_IPV6=n
# Включает транспортный протокол TCP (база для HTTP и WebSockets).
CONFIG_NET_TCP=y
# Включает POSIX-совместимый API сокетов (socket(), bind(), listen()), упрощающий написание сетевого кода.
CONFIG_NET_SOCKETS=y
# Менеджер сетевых подключений для координации работы интерфейсов.
CONFIG_NET_CONNECTION_MANAGER=y
# Добавляет сетевые команды в консоль (например, net iface, ping).
CONFIG_NET_SHELL=y

# Включает уровень канального доступа (Layer 2) для Ethernet-контроллеров.
CONFIG_NET_L2_ETHERNET=y
# Включает клиент DHCPv4, позволяющий устройству автоматически получать IP-адрес от роутера.
CONFIG_NET_DHCPV4=y
# Включает клиент разрешения доменных имен (DNS).
CONFIG_DNS_RESOLVER=y

# Настройка пулов памяти под сетевые пакеты (net_pkt) и блоки буферов (net_buf).
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_CONTEXT_NET_PKT_POOL=y

# Network address config
# Отключение статической предконфигурации сетевых адресов.
# Поскольку выше включен DHCPv4, ручное жесткое задание IP-адресов отключено. Устройство получает параметры динамически.
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_NEED_IPV6=n
# CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
# CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"
# CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
# CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
# CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::2"

# Убирает задержку в состоянии TIME_WAIT для закрывающихся TCP-соединений.
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# Ограничение максимального числа одновременных сетевых контекстов и TCP-соединений до 10.
# Предотвращает перерасход оперативной памяти
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=10

# Подсистема управления сетью и генерации событий.
# Позволяет коду приложения отслеживать системные события (например, «линк поднят», «IP получен») через колбэки.
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y


# General config
# Требует подключения полной стандартной библиотеки языка C (а не урезанной мини-версии вроде picolibc).
# Необходима для корректной работы сторонних библиотек и сложных алгоритмов обработки данных.
CONFIG_REQUIRES_FULL_LIBC=y
# Подсистема ввода (кнопки, датчики).
CONFIG_INPUT=y
# Включает шину SPI (используется для дисплеев или камер).
CONFIG_SPI=y
# Базовый контроль портов ввода-вывода (управление пинами).
CONFIG_GPIO=y
# CONFIG_LED=y

# Подсистема захвата и обработки видео (работа с камерами, фреймбуферами).
CONFIG_VIDEO=y
# Подсистема вывода графики на экран дисплея.
CONFIG_DISPLAY=y
# Включает UART/USB консоль для управления устройствами.
CONFIG_DEVICE_SHELL=y

# Включает быстрый вывод сообщений ядра в консоль.
CONFIG_PRINTK=y
# Включает поддержку вывода чисел с плавающей точкой (float/double) в функциях форматированного вывода (printk/printf).
CONFIG_CBPRINTF_FP_SUPPORT=y
# Гарантирует поддержку вывода float на уровне глобального форматирования.
CONFIG_REQUIRES_FLOAT_PRINTF=y

# Подключить API обёртку для POSIX (Portable Operating System Interface) стандарта.
CONFIG_POSIX_API=y
# Event File Descriptors - включает поддержку механизма POSIX-совместимого способа уведомления о событиях через файловые дескриптор.
CONFIG_EVENTFD=y

# ZVFS (Zephyr Virtual Filesystem) - мост между Zephyr и стандартами POSIX/C для работы с файлами, сокетами и устройствами.
# Значение 32 означает, что можно одновременно опрашивать до 32 сокетов или других файловых дескрипторов. 
CONFIG_ZVFS_POLL_MAX=32
# Максимальное количество событий для сетевых подсистем (HTTP-сервер, CoAP-сервер, LwM2M, PTP, SSH, socket service) .
CONFIG_ZVFS_EVENTFD_MAX=4
# Дополнительное количество слотов для открытых файловых дескрипторов для обработки одновременных клиентских соединений.
CONFIG_ZVFS_OPEN_ADD_SIZE_NET_SAMPLE=24


# Включение алгоритма хеширования SHA-1 в криптографическом бэкенде mbedTLS (через стандартизированный API PSA Crypto).
# Протокол WebSocket на этапе рукопожатия (Sec-WebSocket-Accept) требует обязательного вычисления хеша SHA-1 от специального ключа клиента.
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_MBEDTLS_SHA1=y



# ==========================================================================
# Включает подсистему дисплея Zephyr, именно через эту подсистему LVGL получает доступ к дисплею.
CONFIG_DISPLAY=y
# В отложенном режиме сообщения в подсистеме логирования не выводятся немедленно, а помещаются в буфер и обрабатываются фоновым потоком.
CONFIG_LOG_MODE_DEFERRED=y
# Задаёт размер системной кучи ядра Zephyr в байтах. Драйверы (дисплея и input) используют динамическое выделение памяти под буферы.
CONFIG_HEAP_MEM_POOL_SIZE=46144

# Включает драйвер резистивного тачскрина XPT2046. Драйвер работает через шину SPI и создаёт устройство ввода в подсистеме input.
CONFIG_INPUT_XPT2046=y
# Включает поддержку шины SPI на уровне драйверов Zephyr. SPI необходим для работы дисплея и сенсорной панели.
CONFIG_SPI=y
# Включает подсистему GPIO Zephyr. Нужна для управления пинами (сброс дисплея, прерывание тачскрина, подсветка)
CONFIG_GPIO=y

# Устанавливает уровень логирования для подсистемы input на DBG (debug). Это самый подробный уровень - выводятся все отладочные сообщения.
# CONFIG_INPUT_LOG_LEVEL_DBG=y

# # Включает графическую библиотеку LVGL как модуль Zephyr. 
# CONFIG_LVGL=y
# # Задаёт глубину цвета LVGL - 16 бит на пиксель, формат RGB565 на ST7796.
# CONFIG_LV_COLOR_DEPTH_16=y

# # Включает подсистему ввода Zephyr. Это обязательное условие для работы любого драйвера ввода (включая XPT2046) и для связки с LVGL.
# CONFIG_INPUT=y
# # Включает мост между подсистемой input Zephyr и LVGL. Этот код слушает события от устройства ввода и преобразует их в lv_indev_data_t.
# CONFIG_LV_Z_POINTER_INPUT=y

# # Включает виджет slider (ползунок) в сборке LVGL.
# CONFIG_LV_USE_SLIDER=y
# # Модуль LVGL при инициализации находит устройство, на которое указывает zephyr,touch, и подписывается на его события. 
# CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=y

# # Задаёт размер кучи, выделенной специально для LVGL, в байтах.
# CONFIG_LV_Z_MEM_POOL_SIZE=16384
# # Включает встроенную систему логирования LVGL.
# CONFIG_LV_USE_LOG=y
# # Сообщает интеграционному слою LVGL/Zephyr, сколько бит на пиксель используется в буферах дисплея.
# CONFIG_LV_Z_BITS_PER_PIXEL=16
# # Выполняет байтовый своп для 16-битных цветов RGB565. Без свопа вы увидите инвертированные цвета.
# CONFIG_LV_COLOR_16_SWAP=y


# Включает библиотеку libmpix — легковесную библиотеку для обработки пиксельных данных на микроконтроллерах.
CONFIG_MPIX=y

# Включаем поддержку C++.
CONFIG_CPP=y
# Выбираем стандарт C++17 для исходников TFLM.
CONFIG_STD_CPP17=y
# Требуем полноценную реализацию стандартной C-библиотеки.
CONFIG_REQUIRES_FULL_LIBC=y
# Включаем TensorFlow Lite Micro.
CONFIG_TENSORFLOW_LITE_MICRO=y