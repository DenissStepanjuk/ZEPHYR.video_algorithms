<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zephyr Stream</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  display:flex;flex-direction:column;align-items:center;
  background:#520707;color:#b8a830;
  font-family:Inter,system-ui,sans-serif;padding:16px;gap:20px;
}
h1{font-size:13px;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.content{display:flex;align-items:flex-start;justify-content:center;gap:24px;flex-wrap:wrap}
img{max-width:80vw;max-height:80vh;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.7);background:#111;display:block}

.panel{
  display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:12px;
  background:rgba(0,0,0,.18);border:1px solid rgba(184,168,48,.25);
  border-radius:10px;padding:12px;width:168px;flex-shrink:0;
}
.panel-title{
  font-size:9px;font-weight:600;letter-spacing:.6px;
  text-transform:uppercase;color:#b8a830;text-align:center;white-space:nowrap;
}
.filter-list{
  display:flex;flex-direction:column;gap:8px;
}
.filter-row{
  display:flex;align-items:center;gap:8px;
  padding:4px 6px;border-radius:6px;
  user-select:none;
  transition:background .12s;
}
.filter-row:hover{
  background:rgba(184,168,48,.08);
}
.filter-row input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;
  position:relative;width:16px;height:16px;flex-shrink:0;
  border:1.5px solid #b8a830;border-radius:4px;
  background:transparent;cursor:pointer;
  transition:background .12s,box-shadow .12s;
}
.filter-row input[type="checkbox"]:checked{
  background:#b8a830;
  box-shadow:0 0 0 2px rgba(184,168,48,.22);
}
.filter-row input[type="checkbox"]:checked::after{
  content:'\2713';
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#520707;font-size:11px;font-weight:700;
}
.filter-label{
  font-size:12px;line-height:1.25;color:#b8a830;white-space:nowrap;cursor:pointer;
}
</style>
</head>
<body>
<h1>Zephyr Stream</h1>
<div class="content">
  <img id="v">
  <div class="panel">
    <div class="panel-title">Convolution Kernels</div>
    <div class="filter-list" id="g"></div>
  </div>
</div>

<script>
const W=160,H=120,C=document.createElement('canvas'),X=C.getContext('2d'),V=document.getElementById('v');
C.width=W;C.height=H;let L=null;

function D(b, o) {
 const a = new Uint8Array(b), m = new ImageData(W, H), p = m.data;
 for (let j = o || 0, k = 0; k < W * H; k++, j += 2) {
  let n = (a[j+1] << 8) | a[j];
  p[k*4]     = ((n >> 11)      * 33) >> 2;
  p[k*4 + 1] = ((n >> 5  & 63) * 65) >> 4;
  p[k*4 + 2] = ((n       & 31) * 33) >> 2;
  p[k*4 + 3] = 255;
 }
 return m;
}

const S=new WebSocket('/');
S.binaryType='arraybuffer';

const MAX_SELECTED = 2;
const filters = ['Gaussian blur', 'Edge detect', 'Denoise', 'Sharpen'];
const checkbox_array = [false, false, false, false];

const G=document.getElementById('g'),inputs=[];

function countSelected() {
  return checkbox_array.reduce((acc, v) => acc + (v ? 1 : 0), 0);
}

function sendCheckboxState(index, value) {
  const payload = JSON.stringify({
    type: 'checkbox',
    index: String(index),
    value: Boolean(value)
  });
  if (S.readyState === WebSocket.OPEN) {
    S.send(payload);
  }
}

function setCheckboxState(index, nextVal, fromRemote = false) {
  const inp = inputs[index];
  if (!inp) return;

  if (nextVal && !checkbox_array[index] && countSelected() >= MAX_SELECTED) {
    inp.checked = checkbox_array[index];
    return;
  }

  checkbox_array[index] = nextVal;
  inp.checked = nextVal;

  if (!fromRemote) {
    sendCheckboxState(index, nextVal);
  }
}

filters.forEach((name, i) => {
  const row = document.createElement('div');
  row.className = 'filter-row';

  const inp = document.createElement('input');
  inp.type = 'checkbox';
  inp.id = `flt_${i}`;
  inp.value = i;
  inp.checked = checkbox_array[i];

  const lbl = document.createElement('label');
  lbl.className = 'filter-label';
  lbl.htmlFor = inp.id;
  lbl.textContent = name;

  inp.addEventListener('change', () => {
    setCheckboxState(i, inp.checked, false);
  });

  inputs.push(inp);
  row.appendChild(inp);
  row.appendChild(lbl);
  G.appendChild(row);
});

S.onmessage=e=>{
 if(e.data instanceof ArrayBuffer){
  X.putImageData(D(e.data,1),0,0);
  C.toBlob(b=>{if(!b)return;L&&URL.revokeObjectURL(L);V.src=L=URL.createObjectURL(b);},'image/jpeg',1);
  return;
 }
 try{
  const obj=JSON.parse(e.data);
  if(obj.type==='checkbox'){
   const idx = Number(obj.index);
   if (Number.isInteger(idx) && idx >= 0 && idx < inputs.length) {
    setCheckboxState(idx, Boolean(obj.value), true);
   }
  }
 }catch(err){}
};
</script>
</body>
</html>
