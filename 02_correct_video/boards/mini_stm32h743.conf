# ---------------------------------------------------------------------------------------------------------------------------------------------
# west build -p always -b mini_stm32h743 -- -DDTC_OVERLAY_FILE=boards/mini_stm32h743.overlay -DEXTRA_CONF_FILE=boards/mini_stm32h743.conf
# ---------------------------------------------------------------------------------------------------------------------------------------------

# Указываем что платформой для проекта выбрана плата STM32.
CONFIG_STM32_TRUE=y
# Включаем в проект сервер.
CONFIG_SERVER_TRUE=y
# Включаем в проект дисплей.
CONFIG_DISPLAY_TRUE=y

# Размер heap памяти для выделения видео буферов (в байтах)
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=80000
# Размер кадра захваченого камерой.
CONFIG_VIDEO_FRAME_HEIGHT=120
CONFIG_VIDEO_FRAME_WIDTH=160
# Устанавливает формат пикселей RGBP (соответствует стандарту RGB565 — 16 бит на пиксель).
CONFIG_VIDEO_PIXEL_FORMAT="RGBP"
# Vertical Flip (зеркальное отражение по вертикали)
CONFIG_VIDEO_CTRL_VFLIP=n
# Horizontal Flip (зеркальное отражение по горизонтали).
CONFIG_VIDEO_CTRL_HFLIP=n

# Включает встроенный в Zephyr драйвер для популярного аппаратного Ethernet-контроллера W5500.
CONFIG_ETH_W5500=y
# Устанавливает тайм-аут операций обмена с чипом W5500 (в миллисекундах — 1000 мс / 1 секунда).
CONFIG_ETH_W5500_TIMEOUT=1000

# Принудительная задержка старта системы (Boot Delay) на 5000 миллисекунд (5 секунд).
CONFIG_BOOT_DELAY=5000

# Включает драйверы последовательных интерфейсов ввода-вывода (Serial).
CONFIG_SERIAL=y
# Активирует общую подсистему системной консоли Zephyr.
CONFIG_CONSOLE=y
# Направляет вывод консоли через последовательный интерфейс
CONFIG_UART_CONSOLE=y

# Включает управление линиями связи последовательного порта (UART Line Control).
CONFIG_UART_LINE_CTRL=y

# Выделяет 2 КБ (2048 байт) под кольцевой буфер логирования.
CONFIG_LOG_BUFFER_SIZE=2048
# Задает уровень детализации логов для подсистемы дисплея строго на уровень Errors (только ошибки).
CONFIG_DISPLAY_LOG_LEVEL_ERR=y