<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zephyr Stream</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  display:flex;flex-direction:column;align-items:center;
  background:#520707;color:#b8a830;
  font-family:Inter,system-ui,sans-serif;padding:16px;gap:20px;
}
h1{font-size:13px;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.content{display:flex;align-items:flex-start;justify-content:center;gap:24px;flex-wrap:wrap}
img{max-width:80vw;max-height:80vh;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.7);background:#111;display:block}

.panel{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  background:rgba(0,0,0,.18);border:1px solid rgba(184,168,48,.25);
  border-radius:10px;padding:10px 8px;width:110px;flex-shrink:0;
}
.panel-title{
  font-size:8px;font-weight:500;letter-spacing:.5px;
  text-transform:uppercase;color:#b8a830;text-align:center;white-space:nowrap;
}
.color-grid{display:grid;grid-template-columns:repeat(4,22px);grid-template-rows:repeat(4,22px);gap:4px}
.swatch{
  position:relative;width:22px;height:22px;border-radius:5px;
  background:var(--swatch);border:1px solid rgba(0,0,0,.35);cursor:pointer;
  transition:box-shadow .12s,transform .12s;
}
.swatch:active{transform:scale(.92)}
.swatch input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.swatch:has(input:checked){box-shadow:0 0 0 2px #520707,0 0 0 4px #b8a830}
.swatch::after{
  content:'';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .12s;
}
.swatch:has(input:checked)::after{
  content:'\2713';opacity:1;color:var(--check,#000);font-size:13px;font-weight:700;text-shadow:0 0 2px rgba(255,255,255,.5);
}
</style>
</head>
<body>
<h1>Zephyr Stream</h1>
<div class="content">
  <img id="v">
  <div class="panel">
    <div class="panel-title">Color palette</div>
    <div class="color-grid" id="g"></div>
  </div>
</div>

<script>
const W=160,H=120,C=document.createElement('canvas'),X=C.getContext('2d'),V=document.getElementById('v');
C.width=W;C.height=H;let L=null;

function D(b, o) {
 const a = new Uint8Array(b), m = new ImageData(W, H), p = m.data;
 for (let j = o || 0, k = 0; k < W * H; k++, j += 2) {
  let n = (a[j+1] << 8) | a[j];
  p[k*4]     = ((n >> 11)      * 33) >> 2;
  p[k*4 + 1] = ((n >> 5  & 63) * 65) >> 4;
  p[k*4 + 2] = ((n       & 31) * 33) >> 2;
  p[k*4 + 3] = 255;
 }
 return m;
}

const S=new WebSocket('/');
S.binaryType='arraybuffer';

const colors=[
 ['WHITE','#FFFFFF','#222'],['BLACK','#000000','#fff'],['RED','#E53935','#fff'],
 ['ORANGE','#FB8C00','#fff'],['YELLOW','#FDD835','#222'],['GREEN','#43A047','#fff'],
 ['CYAN','#00ACC1','#fff'],['BLUE','#1E88E5','#fff'],['PURPLE','#8E24AA','#fff'],
 ['PINK','#EC407A','#fff'],['BROWN','#795548','#fff'],['GRAY','#9E9E9E','#222'],
 ['LIME','#CDDC39','#222'],['TEAL','#009688','#fff'],['INDIGO','#3F51B5','#fff'],
 ['TURQUOISE','#40E0D0','#222']
];

const G=document.getElementById('g'),inputs=[];

colors.forEach(([name,hex,check],i)=>{
 const s=document.createElement('label');
 s.className='swatch';s.style.cssText=`--swatch:${hex};--check:${check}`;s.title=name;
 const inp=document.createElement('input');
 inp.type='checkbox';inp.value=i;inp.checked=true;

 inp.onchange=()=>{
  S.send(JSON.stringify({type:'checkbox',index:inp.value,value:inp.checked}));
 };
 inputs.push(inp);s.appendChild(inp);G.appendChild(s);
});

S.onmessage=e=>{
 if(e.data instanceof ArrayBuffer){
  X.putImageData(D(e.data,1),0,0);
  C.toBlob(b=>{if(!b)return;L&&URL.revokeObjectURL(L);V.src=L=URL.createObjectURL(b);},'image/jpeg',1);
  return;
 }
 try{
  const obj=JSON.parse(e.data);
  if(obj.type==='checkbox'&&inputs[obj.index]){
   inputs[obj.index].checked=obj.value;
  }
 }catch(err){}
};
</script>
</body>
</html>
