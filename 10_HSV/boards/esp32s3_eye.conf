# ---------------------------------------------------------------------------------------------------------------------------------------------
# west build -p always -b esp32s3_eye/esp32s3/procpu -- -DDTC_OVERLAY_FILE=boards/esp32s3_eye.overlay -DEXTRA_CONF_FILE=boards/esp32s3_eye.conf
# ---------------------------------------------------------------------------------------------------------------------------------------------

# Указываем что платформой для проекта выбрана плата ESP32.
CONFIG_ESP32_TRUE=y
# Включаем в проект сервер.
CONFIG_SERVER_TRUE=y
# Включаем в проект дисплей.
CONFIG_DISPLAY_TRUE=y

# Включает подсистему беспроводной связи Wi-Fi в Zephyr.
CONFIG_WIFI=y
# Выделяет пул памяти размером 76 800 байт (около 75 КБ) специально под видеоданные.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=76800
# Ограничивает максимальное количество одновременных видеобуферов в пуле до 2 штук.
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
# Включает поддержку внешней оперативной памяти (PSRAM).
CONFIG_ESP_SPIRAM=y
# Устанавливает режим работы с PSRAM памятью в Octal (8 линий данных).
CONFIG_SPIRAM_MODE_OCT=y
# Выравнивание видеобуферов по границе 32 байт.
CONFIG_VIDEO_BUFFER_POOL_ALIGN=32
# Захват видео с камеры идет через контроллер DMA (прямой доступ к памяти) без участия процессора.
# Зарезервировать в памяти место под цепочку из 64 дескрипторов для корректного захвата кадра.
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=64
# Подключает менеджер разделяемой многоуровневой кучи (Shared Multi-Heap) для распределения памяти между внутренней SRAM и внешней PSRAM.
CONFIG_VIDEO_BUFFER_USE_SHARED_MULTI_HEAP=y
# Атрибут 2 указывает на пул внешней PSRAM.
CONFIG_VIDEO_BUFFER_SMH_ATTRIBUTE=2
# Размер кадра захваченого камерой.
CONFIG_VIDEO_FRAME_HEIGHT=120
CONFIG_VIDEO_FRAME_WIDTH=160
# Устанавливает формат пикселей RGBP (соответствует стандарту RGB565 — 16 бит на пиксель).
CONFIG_VIDEO_PIXEL_FORMAT="RGBP"
# Vertical Flip (зеркальное отражение по вертикали).
CONFIG_VIDEO_CTRL_VFLIP=n
# Horizontal Flip (зеркальное отражение по горизонтали).
CONFIG_VIDEO_CTRL_HFLIP=y

# Автоматический запуск DHCP-клиента при успешном подключении ESP32 к точке доступа (в режиме Station).
# Как только Wi-Fi устанавливает соединение с роутером, стек автоматически запрашивает IP-адрес,
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
# CONFIG_WIFI_STA_AUTO_DHCPV4=y

# Перенаправление выделения памяти для Wi-Fi драйвера Espressif во внутреннюю системную кучу Zephyr.
CONFIG_ESP_WIFI_HEAP_SYSTEM=y